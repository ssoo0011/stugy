spring.application.name=stuGy
spring.config.import=optional:file:.env.properties
server.port=8081
spring.datasource.url=${STUGY_DB_URL:jdbc:mysql://localhost:3306/stugy?createDatabaseIfNotExist=true&useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Seoul}
spring.datasource.username=${STUGY_DB_USERNAME:so}
spring.datasource.password=${STUGY_DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=Asia/Seoul
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB
server.servlet.session.timeout=30d
spring.session.timeout=30d
spring.session.jdbc.initialize-schema=never
app.file.storage-root=${STUGY_FILE_STORAGE_ROOT:uploads}
app.security.remember-me-key=${STUGY_REMEMBER_ME_KEY:stugy-local-remember-me-key}
