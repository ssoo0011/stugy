plugins {
	id 'java'
	id 'org.springframework.boot' version '4.0.6'
	id 'io.spring.dependency-management' version '1.1.7'
	id 'com.github.node-gradle.node' version '7.1.0'
}

group = 'com.stugy'
version = '0.0.1-SNAPSHOT'
description = 'Mobile-first study group finder'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(17)
	}
}

repositories {
	mavenCentral()
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.mybatis.spring.boot:mybatis-spring-boot-starter:4.0.0'
	implementation 'org.springframework.boot:spring-boot-starter-security'
	implementation 'org.springframework.boot:spring-boot-starter-validation'
	implementation 'org.springframework.boot:spring-boot-starter-webmvc'
	implementation 'org.springframework.boot:spring-boot-starter-session-jdbc'
	runtimeOnly 'com.mysql:mysql-connector-j'
	testImplementation 'org.springframework.boot:spring-boot-starter-validation-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
	testRuntimeOnly 'com.h2database:h2'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
	useJUnitPlatform()
}

node {
	version = '22.14.0'
	download = true
	nodeProjectDir = file("${project.projectDir}/frontend")
}

tasks.register('npmBuild', com.github.gradle.node.npm.task.NpmTask) {
	dependsOn tasks.npmInstall
	args = ['run', 'build']
	inputs.dir('frontend/src')
	inputs.files('frontend/index.html', 'frontend/package.json', 'frontend/package-lock.json', 'frontend/vite.config.js')
	outputs.dir('frontend/dist')
}

tasks.register('copyFrontend', Sync) {
	dependsOn tasks.npmBuild
	from 'frontend/dist'
	into layout.buildDirectory.dir('generated-resources/static')
}

sourceSets {
	main {
		resources {
			srcDir layout.buildDirectory.dir('generated-resources')
		}
	}
}

tasks.named('processResources') {
	dependsOn tasks.copyFrontend
}
